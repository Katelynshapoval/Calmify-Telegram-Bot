version: "3.9"

services:
  bot:
    build: .
    container_name: telegram-bot
    depends_on:
      - ollama
    environment:
      - OLLAMA_URL=http://ollama:11434
    restart: always

  ollama:
    image: ollama/ollama
    container_name: ollama-server
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: always

volumes:
  ollama_data:
